# Рабочее окружение для Coolify (ресурс Docker Compose, сборка из репозитория по deploy key,
# обновление при пуше в main). Отличия от docker-compose.standalone.yml (сервер без Coolify):
#   - nginx принимает HTTP на порту сервера HTTP_PORT (тот же номер в контейнере); HTTPS,
#     сертификат и домен — у прокси администратора сервера, TRUST_PROXY=2;
#   - конфигурация nginx входит в образ (docker/nginx/Dockerfile);
#   - сервиса резервного копирования (backup) пока нет — временно отключён по решению
#     администратора сервера, вернуть можно из docker-compose.standalone.yml;
#   - имя проекта, сети и имена томов задаёт Coolify.
# Переменные задаются в Coolify (Environment Variables); описание — docs/deploy/coolify.md.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в Coolify}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-iot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-iot}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в Coolify}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Перед API два прокси: внешний с HTTPS и nginx этого файла.
      TRUST_PROXY: '2'
    volumes:
      - files:/var/lib/iot/files
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    # HTTP на порту HTTP_PORT: тот же номер внутри контейнера и на сервере. HTTPS и домен —
    # у прокси администратора сервера, который направляет запросы на этот порт.
    environment:
      HTTP_PORT: ${HTTP_PORT:?Задайте HTTP_PORT в Coolify — порт приложения на сервере}
    ports:
      - '${HTTP_PORT}:${HTTP_PORT}'
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

volumes:
  pgdata:
  files:
