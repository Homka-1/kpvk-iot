# Рабочее окружение для Coolify (ресурс Docker Compose, сборка из репозитория по deploy key,
# обновление при пуше в main). Отличия от docker-compose.standalone.yml (сервер без Coolify):
#   - nginx слушает порты HTTP_PORT и HTTPS_PORT (те же номера на сервере и в контейнере),
#     сертификат — из каталога сервера /srv/kpvk-iot/certs, копии — в /srv/kpvk-iot/backups
#     (Coolify не допускает переменных в путях томов);
#   - конфигурация nginx входит в образ (docker/nginx/Dockerfile), порты подставляются при старте;
#   - имя проекта, сети и имена томов задаёт Coolify.
# Переменные задаются в Coolify (Environment Variables); описание — docs/deploy/coolify.md.

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в Coolify}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-iot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-iot}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в Coolify}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Перед API ровно один прокси — nginx этого файла.
      TRUST_PROXY: '1'
    volumes:
      - files:/var/lib/iot/files
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    # nginx слушает эти порты внутри контейнера, на сервере они открываются под теми же номерами.
    # HTTP_PORT только перенаправляет на HTTPS_PORT.
    environment:
      HTTP_PORT: ${HTTP_PORT:?Задайте HTTP_PORT в Coolify}
      HTTPS_PORT: ${HTTPS_PORT:?Задайте HTTPS_PORT в Coolify}
    ports:
      - '${HTTP_PORT}:${HTTP_PORT}'
      - '${HTTPS_PORT}:${HTTPS_PORT}'
    volumes:
      # Каталог на сервере с fullchain.pem и privkey.pem. Coolify не допускает переменных
      # в путях томов, поэтому путь задан здесь.
      - /srv/kpvk-iot/certs:/etc/nginx/certs:ro
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-iot}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-iot}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-30 2 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      TZ: ${TZ:-Asia/Almaty}
    volumes:
      - files:/data/files
      # Каталог копий на сервере вне каталогов Coolify (переменные в путях томов Coolify запрещает).
      - /srv/kpvk-iot/backups:/backups
    logging: *logging

volumes:
  pgdata:
  files:
