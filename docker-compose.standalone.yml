# Рабочее окружение (production): PostgreSQL, API, статика интерфейса, nginx с HTTPS и
# резервное копирование по расписанию. Запуск и обслуживание — docs/deploy/README.md.
#   docker compose -f docker-compose.standalone.yml --env-file .env.prod up -d --build --wait
# Переменные — .env.prod (образец .env.prod.example, описание docs/deploy/environment.md).

# Имя проекта задаёт имена томов (iot_pgdata, iot_files): данные не зависят от каталога установки.
# Тестовый экземпляр на том же сервере запускается с другим именем: -p iot-test.
name: iot

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-iot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    image: iot-api:${IOT_VERSION:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-iot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-iot}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в .env.prod}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-900}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-20}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Перед API ровно один прокси — nginx этого файла.
      TRUST_PROXY: '1'
    volumes:
      - files:/var/lib/iot/files
    networks: [backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

  web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: iot-web:${IOT_VERSION:-local}
    restart: unless-stopped
    networks: [frontend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging

  nginx:
    image: nginxinc/nginx-unprivileged:1.30-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - '${HTTP_PORT:-80}:8080'
      - '${HTTPS_PORT:-443}:8443'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
    networks: [frontend, backend]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO /dev/null http://127.0.0.1:8080/healthz || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    image: iot-backup:${IOT_VERSION:-local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-iot}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-iot}
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-30 2 * * *}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
      TZ: ${TZ:-Asia/Almaty}
    volumes:
      - files:/data/files
      - ${BACKUP_HOST_DIR:-./backups}:/backups
    networks: [backend]
    logging: *logging

networks:
  # Внутренняя сеть: база и API недоступны снаружи, только через nginx.
  backend:
    internal: true
  frontend:

volumes:
  pgdata:
  files:
