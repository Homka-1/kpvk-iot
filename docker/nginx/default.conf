# Внешний nginx: HTTPS, перенаправление с HTTP, сжатие, лимит загрузки и проксирование
# на API (/api) и статику интерфейса (всё остальное). Сертификат монтируется в /etc/nginx/certs:
# fullchain.pem (сертификат с цепочкой) и privkey.pem (закрытый ключ).

# Файлы библиотеки — до 20 МБ (FILE_UPLOAD_MAX_BYTES), запас на заголовки multipart.
client_max_body_size 25m;
server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml;

server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS ставится здесь для всех ответов; одноимённый заголовок API скрывается, чтобы не дублировать.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Встроенный DNS Docker: адреса api и web перечитываются, если контейнер пересоздан
    # при обновлении, — без перезапуска nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    set $web_upstream http://web:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Заголовок перезаписывается, а не дополняется: API доверяет одному прокси (TRUST_PROXY=1)
    # и берёт адрес клиента отсюда; подделать его из браузера нельзя.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_hide_header Strict-Transport-Security;
        # Отчёты PDF/XLSX и выгрузки формируются до нескольких десятков секунд.
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass $web_upstream;
    }
}
