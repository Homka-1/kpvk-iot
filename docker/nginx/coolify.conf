# nginx для развёртывания через Coolify (docker-compose.prod.yml). HTTPS, сертификат и
# перенаправление с HTTP выполняет прокси Coolify (Traefik); этот nginx принимает от него HTTP
# и, как default.conf, делит запросы между API (/api) и статикой интерфейса, сжимает ответы и
# ограничивает размер загрузки.

# Файлы библиотеки — до 20 МБ (FILE_UPLOAD_MAX_BYTES), запас на заголовки multipart.
client_max_body_size 25m;
server_tokens off;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied any;
gzip_vary on;
gzip_types text/plain text/css text/csv application/javascript application/json image/svg+xml;

server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Браузер учитывает HSTS только в ответах по HTTPS, а снаружи их отдаёт Traefik.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Встроенный DNS Docker: адреса api и web перечитываются, если контейнер пересоздан
    # при обновлении, — без перезапуска nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:3000;
    set $web_upstream http://web:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Перед API два прокси (Traefik и этот nginx), поэтому TRUST_PROXY=2: API берёт адрес
    # клиента, который записал Traefik, и не доверяет значениям, присланным из браузера.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_hide_header Strict-Transport-Security;
        # Отчёты PDF/XLSX и выгрузки формируются до нескольких десятков секунд.
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass $web_upstream;
    }
}
