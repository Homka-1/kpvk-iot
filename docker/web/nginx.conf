# Статика веб-интерфейса. Внешний nginx (docker/nginx) проксирует сюда всё, кроме /api.
# Заголовки безопасности подключаются в каждом location: add_header внутри location
# отменяет заголовки уровня server.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Файлы сборки с хешем в имени не меняются — долгий кэш.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Маршруты приложения обрабатывает Vue Router: неизвестный путь отдаёт index.html.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
