# Окружение разработки: PostgreSQL 16 с двумя базами — iot_dev (разработка) и iot_test (тесты).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iot_dev_password}
      POSTGRES_DB: iot_dev
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d iot_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata-dev:
